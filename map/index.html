<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/jpeg" href="/favicon.jpeg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>March Route Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; }
        #header {
            background: #0a0a0a;
            border-bottom: 3px solid #d62828;
            padding: 16px 24px;
            text-align: center;
        }
        #header h1 {
            color: #f0ece4;
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #header p {
            color: #d62828;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            margin-top: 4px;
            letter-spacing: 1px;
        }
        #map { width: 100%; height: calc(100vh - 80px); }
        .leaflet-control-attribution {
            background: rgba(10,10,10,0.8) !important;
            color: #555 !important;
            font-size: 9px !important;
        }
        .leaflet-control-attribution a { color: #666 !important; }
        .leaflet-control-zoom a {
            background: rgba(10,10,10,0.85) !important;
            color: #f0ece4 !important;
            border-color: rgba(214,40,40,0.3) !important;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>March Route</h1>
        <p>San Francisco</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/map.js"></script>
    <script>initRouteMap('map');</script>
</body>
</html>
