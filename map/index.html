<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>March Route Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Libre+Baskerville:wght@400;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #f0ece4;
            font-family: 'Libre Baskerville', serif;
        }
        #header {
            background: #0a0a0a;
            border-bottom: 3px solid #d62828;
            padding: 16px 24px;
            text-align: center;
        }
        #header h1 {
            color: #f0ece4;
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #header p {
            color: #d62828;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            margin-top: 4px;
            letter-spacing: 1px;
        }
        #map {
            width: 100%;
            height: calc(100vh - 80px);
        }
        .custom-marker {
            background: none;
            border: none;
        }
        .marker-inner {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .marker-label {
            background: none;
            color: #f0ece4;
            border: none;
            font-size: 20px;
            font-weight: 400;
            white-space: nowrap;
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: 0.5px;
            text-shadow: 0 0 6px #0a0a0a, 0 0 6px #0a0a0a, 0 0 3px #0a0a0a;
        }
        .marker-company {
            color: #f0ece4;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 21px;
            font-weight: 700;
            white-space: nowrap;
            text-shadow: 0 0 6px #0a0a0a, 0 0 6px #0a0a0a, 0 0 3px #0a0a0a;
        }
        .marker-dot {
            width: 18px;
            height: 18px;
            min-width: 18px;
            background: #d62828;
            border: 3px solid #f0ece4;
            border-radius: 50%;
        }
        .leaflet-tile-pane {
            filter: saturate(0) brightness(0.35) contrast(1.2);
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>March Route</h1>
        <p>San Francisco</p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map with dark styling
        const map = L.map('map', {
            center: [37.7790, -122.3940],
            zoom: 15,
            zoomControl: false,
            minZoom: 13
        });

        // OpenStreetMap tiles (desaturated via CSS for dark theme)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // === LEG 1: 500 Howard St to 1455 3rd St ===
        const leg1 = [
            [37.7884, -122.3963],    // 500 Howard St (START)
            [37.7868, -122.3983],    // Howard & 2nd
            [37.7825, -122.3929],    // 2nd & South Park
            [37.7807, -122.3951],    // South Park & 3rd
            [37.7795, -122.3936],    // 3rd St (heading southeast)
            [37.77776, -122.39142],  // 3rd St (bend)
            [37.77754, -122.39113],  // 3rd St (Berry St)
            [37.77716, -122.39070],  // 3rd St (approaching bridge)
            [37.7769, -122.3904],    // 3rd St (north end of bridge)
            [37.7765, -122.3901],    // 3rd St (south end of bridge)
            [37.7762, -122.3900],    // 3rd St (just past bridge)
            [37.7701, -122.3893],    // 1455 3rd St (MIDPOINT)
        ];

        // === LEG 2: 1455 3rd St to Dolores Park ===
        const leg2 = [
            [37.7701, -122.3893],    // 0: 1455 3rd St (MIDPOINT)
            [37.7688, -122.3892],    // 1: 3rd & Gene Friend Way
            [37.7687, -122.3910],    // 2: Gene Friend Way & 4th St
            [37.7668, -122.3908],    // 3: 4th & 16th
            [37.76655, -122.39490],  // 4: 16th & Mississippi (nudged east)
            [37.76525, -122.39486],  // 5: Mississippi & 17th (OSM node 65317334)
            [37.76415, -122.41290],  // 6: 17th approaching Harrison (extended)
            // 17th bend: Harrison to Treat
            [37.76406, -122.41313],  // 7: bend wp (OSM node 4183593002)
            [37.76388, -122.41352],  // 8: bend wp (OSM node 4183592998)
            [37.76380, -122.41375],  // 9: 17th past Treat (extended)
            [37.76370, -122.41517],  // 10: 17th & Folsom (OSM node 65317376)
            [37.76050, -122.41486],  // 11: Folsom & 19th (OSM node 65293569)
            [37.7598, -122.4259],    // 12: 19th & Dolores (END)
        ];

        const route = leg1.concat(leg2.slice(1));

        // Draw the route line
        const routeLine = L.polyline(route, {
            color: '#d62828',
            weight: 5,
            opacity: 0.9,
            lineJoin: 'round',
            lineCap: 'round'
        }).addTo(map);

        // White outline underneath for visibility
        const routeOutline = L.polyline(route, {
            color: '#ffffff',
            weight: 8,
            opacity: 0.3,
            lineJoin: 'round',
            lineCap: 'round'
        }).addTo(map);
        routeOutline.bringToBack();

        // Fit map to route
        map.fitBounds(routeLine.getBounds().pad(0.1));

        // === DOTS: fixed circleMarkers at exact coordinates ===
        const dotStyle = {
            radius: 7,
            fillColor: '#d62828',
            color: '#f0ece4',
            weight: 3,
            fillOpacity: 1
        };

        const stops = [
            { coord: leg1[0], label: '500 Howard St', company: 'Anthropic', side: 'right' },
            { coord: leg1[11], label: '1455 3rd St', company: 'OpenAI', side: 'right' },
            { coord: [leg2[10][0] * 0.55 + leg2[11][0] * 0.45, leg2[10][1] * 0.55 + leg2[11][1] * 0.45], label: '3180 18th St', company: 'xAI', side: 'right' },
            { coord: leg2[12], label: 'Dolores Park', company: null, side: 'left' },
        ];

        stops.forEach(({ coord, label, company, side }) => {
            // Fixed dot
            L.circleMarker(coord, dotStyle).addTo(map);

            // Text label offset to the side
            let html;
            if (side === 'left') {
                html = `<div style="text-align: right;"><div class="marker-company">${label}</div></div>`;
            } else {
                html = `<div>${company ? `<div class="marker-company">${company}</div>` : ''}<div class="marker-label">${label}</div></div>`;
            }

            const icon = L.divIcon({
                className: 'custom-marker',
                html: html,
                iconSize: [0, 0],
                iconAnchor: side === 'left' ? [165, 18] : [-12, 18]
            });
            L.marker(coord, { icon: icon, interactive: false }).addTo(map);
        });

        // Direction arrows computed from actual route segments
        function addArrows() {
            // Calculate bearing between two latlng points
            function bearing(lat1, lon1, lat2, lon2) {
                const toRad = x => x * Math.PI / 180;
                const toDeg = x => x * 180 / Math.PI;
                const dLon = toRad(lon2 - lon1);
                const y = Math.sin(dLon) * Math.cos(toRad(lat2));
                const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                          Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
                return (toDeg(Math.atan2(y, x)) + 360) % 360;
            }

            // Place arrows along key segments using named points for clarity
            const segments = [
                // Leg 1
                { from: leg1[0], to: leg1[1] },      // Howard St
                { from: leg1[1], to: leg1[2] },      // 2nd St
                { from: leg1[2], to: leg1[3] },      // South Park
                { from: leg1[3], to: leg1[7] },      // 3rd St (before bridge)
                { from: leg1[10], to: leg1[11] },    // 3rd St (after bridge)
                // Leg 2
                { from: leg2[1], to: leg2[2] },      // Gene Friend Way
                { from: leg2[2], to: leg2[3] },      // 4th St south
                { from: leg2[3], to: leg2[4] },      // 16th St west
                { from: leg2[4], to: leg2[5] },      // Mississippi St south
                { from: leg2[5], to: leg2[6] },      // 17th St west
                { from: leg2[11], to: leg2[12] },    // 19th St west to Dolores
            ];

            const arrowSize = 21;

            segments.forEach(({ from, to }) => {
                const midLat = (from[0] + to[0]) / 2;
                const midLon = (from[1] + to[1]) / 2;
                // bearing() returns compass degrees (0=N, 90=E, etc.)
                // The arrow character ➤ points right (east) by default = 90° compass
                // So rotation = bearing - 90
                const angle = bearing(from[0], from[1], to[0], to[1]) - 90;

                const icon = L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="
                        width: ${arrowSize}px;
                        height: ${arrowSize}px;
                        line-height: ${arrowSize}px;
                        text-align: center;
                        color: #f0ece4;
                        font-size: ${arrowSize}px;
                        transform: rotate(${angle}deg);
                        text-shadow: 0 0 4px #000, 0 0 4px #000;
                    ">&#10148;</div>`,
                    iconSize: [arrowSize, arrowSize],
                    iconAnchor: [arrowSize / 2, arrowSize / 2]
                });
                L.marker([midLat, midLon], { icon: icon, interactive: false }).addTo(map);
            });
        }
        addArrows();
    </script>
</body>
</html>
