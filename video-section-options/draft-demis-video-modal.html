<!--
  DRAFT - Demis Hassabis "open to a pause" video modal.

  Removed from index.html on 2026-09-22 together with the Sep 2025 timeline point,
  which was the only thing that opened it. To restore: put the markup back in the
  page, re-add the CSS, re-add the script, and give some element id="demis-trigger"
  (it used to be a span inside the Sep 2025 entry, kept below for reference).

  Plays demis_pause.mp4 from the repo root.
-->

<!-- ===== the timeline entry that used to open it ===== -->
    <div class="timeline-item"><span class="timeline-date">Sep 2025</span><p class="timeline-text">An <a href="https://www.theverge.com/ai-artificial-intelligence/778773/the-hunger-strike-to-end-ai-anthropic-google-deepmind-agi" target="_blank" rel="noopener" class="subtle-link">18-day hunger strike</a> outside Google DeepMind. <span class="video-trigger" id="demis-trigger">Demis Hassabis said he’d be open to a pause</span> — if others coordinated.</p></div>

<!-- ===== markup ===== -->
<!-- VIDEO MODAL -->
<div class="video-modal" id="video-modal">
  <div class="video-container">
    <video id="demis-video" controls playsinline preload="none">
      <source data-src="demis_pause.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <button class="close-video" id="close-video">CLOSE ×</button>
  </div>
  <div class="video-caption">
    <a href="https://youtu.be/Xcyox1CP1Wk?si=I0cW8MZfDcbjpr6T&t=704" target="_blank" rel="noopener">
      Demis Hassabis on an AI Shift Bigger Than Industrial Age<br>
      Bloomberg · Davos · Jan 20th, 2026
    </a>
  </div>
</div>

<!-- ===== css ===== -->
<style>
  /* ---- VIDEO MODAL ---- */
  .video-trigger {
    color: var(--white);
    font-weight: 700;
    cursor: pointer;
    display: inline;
    text-decoration: underline dotted rgba(214, 40, 40, 0.5);
    text-underline-offset: 3px;
    transition: color 0.2s ease, text-decoration-color 0.2s ease;
  }

  .video-trigger:hover {
    color: var(--red);
    text-decoration: underline solid var(--red);
  }

  .video-modal {
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: rgba(0, 0, 0, 0.95);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .video-modal.active {
    opacity: 1;
    pointer-events: all;
  }

  .video-container {
    position: relative;
    width: fit-content;
    height: fit-content;
    max-width: 90vw;
    max-height: 80vh;
    background: #000;
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  /* Tech corners */
  .video-container::before,
  .video-container::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    border: 1px solid var(--red);
    transition: all 0.3s ease;
    opacity: 0.5;
    pointer-events: none;
    z-index: 10;
  }

  .video-container::before {
    top: -1px;
    left: -1px;
    border-right: none;
    border-bottom: none;
  }

  .video-container::after {
    bottom: -1px;
    right: -1px;
    border-left: none;
    border-top: none;
  }

  .video-container:hover::before,
  .video-container:hover::after {
    opacity: 1;
    width: 30px;
    height: 30px;
  }

  .video-container video {
    display: block;
    max-width: 100%;
    max-height: 70vh;
    width: auto;
    height: auto;
    object-fit: contain;
    filter: contrast(1.1);
  }

  .close-video {
    position: absolute;
    top: -2.5rem;
    right: 0;
    background: none;
    border: none;
    color: var(--gray);
    font-size: 1.5rem;
    font-family: var(--font-mono);
    cursor: pointer;
    transition: color 0.2s;
  }

  .close-video:hover {
    color: var(--red);
  }

  .video-caption {
    margin-top: 1rem;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    line-height: 1.6;
    max-width: 90%;
  }

  .video-caption a {
    color: var(--gray);
    text-decoration: none;
    transition: color 0.2s;
  }

  .video-caption a:hover {
    color: var(--red);
    text-decoration: underline;
  }
</style>

<!-- ===== script ===== -->
<script>
  const demisTrigger = document.getElementById('demis-trigger');
  const videoModal = document.getElementById('video-modal');
  const demisVideo = document.getElementById('demis-video');
  const closeVideo = document.getElementById('close-video');

  function openVideoModal() {
    var source = demisVideo.querySelector('source');
    if (source.dataset.src) {
      source.src = source.dataset.src;
      demisVideo.load();
    }
    videoModal.classList.add('active');
    demisVideo.play();
  }

  function closeVideoModal() {
    videoModal.classList.remove('active');
    demisVideo.pause();
    demisVideo.currentTime = 0;
  }

  if (demisTrigger) {
    demisTrigger.addEventListener('click', openVideoModal);
  }
  
  if (closeVideo) {
    closeVideo.addEventListener('click', closeVideoModal);
  }

  if (videoModal) {
    videoModal.addEventListener('click', (e) => {
      if (e.target === videoModal) {
        closeVideoModal();
      }
    });
  }
</script>
