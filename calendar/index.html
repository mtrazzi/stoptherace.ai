<style>
  :root {
    --black: #0a0a0a;
    --white: #f0ece4;
    --red: #d62828;
    --red-dark: #a31f1f;
    --red-glow: #ff3333;
    --gray: #888;
    --font-display: 'Outfit', sans-serif;
    --font-body: 'Libre Baskerville', serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  ::selection {
    background: var(--red);
    color: var(--white);
  }

  body {
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  /* ---- GRAIN OVERLAY ---- */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 256px 256px;
  }

  /* ---- HEADER ---- */
  .page-header {
    padding: 5rem 2rem 2.5rem;
    text-align: center;
  }

  .back-link {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gray);
    text-decoration: none;
    margin-bottom: 2rem;
    transition: color 0.2s;
  }

  .back-link:hover { color: var(--red); }

  .page-header h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2.5rem, 8vw, 5rem);
    text-transform: uppercase;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .page-header h1 .red { color: var(--red); }

  .page-header .blurb {
    font-size: 1.1rem;
    line-height: 1.7;
    color: rgba(240, 236, 228, 0.8);
    max-width: 560px;
    margin: 1.5rem auto 0;
  }

  /* ---- CALENDAR (same framing as the landing page section) ---- */
  .ev {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 2rem 5rem;
  }

  /* red corner brackets instead of a full border */
  .ev-box { position: relative; padding: 14px; }
  .ev-box::before, .ev-box::after { content: ''; position: absolute; width: 36px; height: 36px; border: 2px solid var(--red); }
  .ev-box::before { top: 0; left: 0; border-right: none; border-bottom: none; }
  .ev-box::after { bottom: 0; right: 0; border-left: none; border-top: none; }

  .ev-frame {
    display: block;
    width: 100%;
    height: max(640px, calc(100vh - 160px));
    border: 0;
    background: #131313;
  }

  .ev-foot { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.9rem 1.1rem; background: #131313; border-top: 1px solid rgba(214,40,40,0.35); font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(240,236,228,0.7); }
  .ev-foot a { color: var(--white); background: var(--red); padding: 0.5rem 0.9rem; text-decoration: none; white-space: nowrap; transition: background 0.2s; }
  .ev-foot a:hover { background: var(--red-glow); }

  @media (max-width: 600px) {
    .page-header { padding: 4rem 1rem 2rem; }
    .ev { padding: 0 1rem 4rem; }
    .ev-frame { height: 75vh; }
    .ev-foot { flex-direction: column; text-align: center; }
  }
</style>

<body>

<header class="page-header">
  <a href="/" class="back-link">&larr; stoptherace.ai</a>
  <h1>Upcoming <span class="red">Events</span></h1>
  <p class="blurb">Weekly calls, in-person meetups, and actions. RSVP to get the link and reminders.</p>
</header>

<section class="ev">
  <div class="ev-box">
    <iframe class="ev-frame" src="https://luma.com/embed/calendar/cal-WNFStRRMsLxeEZv/events?lt=dark" title="Stop The AI Race events on Luma" allowfullscreen></iframe>
    <div class="ev-foot">
      <span>Never miss an action</span>
      <a href="https://luma.com/stop-the-ai-race" target="_blank" rel="noopener">Follow the calendar &rarr;</a>
    </div>
  </div>
</section>

</body>
