const STORE = 'enc-key:' + location.pathname;
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(key) {
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(P.iv) }, key, unb64(P.data)));
}
function show(html) { document.open(); document.write(html); document.close(); }
async function derive(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
(async () => {
  try {
    const saved = localStorage.getItem(STORE);
    if (saved) show(await decrypt(await crypto.subtle.importKey('raw', unb64(saved), 'AES-GCM', true, ['decrypt'])));
  } catch (e) {}
})();
document.querySelector('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = e.target.querySelector('.err');
  err.textContent = 'Unlocking…';
  const key = await derive(e.target.querySelector('input').value);
  try {
    const html = await decrypt(key);
    const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
    try { localStorage.setItem(STORE, btoa(String.fromCharCode(...raw))); } catch (e2) {}
    show(html);
  } catch (e2) { err.textContent = 'Wrong password'; }
});
