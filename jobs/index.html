<style>
  :root {
    --black: #0a0a0a;
    --white: #f0ece4;
    --red: #d62828;
    --red-dark: #a31f1f;
    --red-glow: #ff3333;
    --gray: #888;
    --font-display: 'Outfit', sans-serif;
    --font-body: 'Libre Baskerville', serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  ::selection {
    background: var(--red);
    color: var(--white);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    overflow-x: hidden;
    cursor: default;
  }

  /* ---- GRAIN OVERLAY ---- */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 256px 256px;
  }

  /* ---- HEADER ---- */
  .page-header {
    padding: 6rem 2rem 2rem;
    text-align: center;
  }

  .page-header h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2.5rem, 8vw, 5rem);
    text-transform: uppercase;
    letter-spacing: -0.03em;
    line-height: 1;
    animation: fadeUp 0.8s 0.1s ease both;
  }

  .page-header h1 .red { color: var(--red); }

  .back-link {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gray);
    text-decoration: none;
    margin-bottom: 2rem;
    transition: color 0.2s;
    animation: fadeUp 0.8s 0s ease both;
  }

  .back-link:hover { color: var(--red); }

  /* ---- SECTIONS ---- */
  .section {
    max-width: 680px;
    margin: 0 auto;
    padding: 2rem 2rem 2rem;
  }

  .kicker {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 0.4rem;
  }

  .section-title {
    font-family: var(--font-display);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    line-height: 1;
    font-size: clamp(1.4rem, 2.6vw, 1.9rem);
    margin-bottom: 1.5rem;
  }

  /* ---- ROLES ---- */
  .roles {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .roles { gap: 1.25rem; }

  .role {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
    min-height: 260px;
    padding: 1.75rem 2rem;
    overflow: hidden;
    color: var(--white);
    text-decoration: none;
    animation: fadeUp 0.7s calc(0.15s + var(--i) * 0.1s) ease backwards;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .role-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: var(--pos) var(--vpos);
    transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .role::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(10, 10, 10, 0.9), rgba(10, 10, 10, 0) 60%);
  }

  .role:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 40px -20px rgba(214, 40, 40, 0.7);
  }

  .role:hover .role-bg { transform: scale(1.07); }

  .role-text, .role-arrow { position: relative; z-index: 1; }

  .role-title {
    font-family: var(--font-display);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    font-size: clamp(1.6rem, 4vw, 2.3rem);
    line-height: 0.95;
    margin-bottom: 0.6rem;
  }

  .role-meta {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 1.6;
  }

  .role-arrow {
    display: grid;
    place-items: center;
    width: 3rem;
    height: 3rem;
    flex-shrink: 0;
    background: var(--red);
    font-family: var(--font-display);
    font-size: 1.3rem;
    transition: transform 0.3s ease;
  }

  .role:hover .role-arrow { transform: translateX(4px); }

  /* ---- PAGE TRANSITION ---- */
  @view-transition { navigation: auto; }
  ::view-transition-group(*) { animation-duration: 0.6s; animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1); }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.35s; }

  @media (prefers-reduced-motion: reduce) {
    @view-transition { navigation: none; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ---- HOW TO APPLY ---- */
  .how p {
    font-size: 1rem;
    line-height: 1.7;
    color: rgba(240, 236, 228, 0.8);
  }

  .how a {
    color: var(--white);
    text-decoration-color: var(--red);
    text-underline-offset: 3px;
  }

  .how a:hover { color: var(--red-glow); }

  /* ---- FOOTER LINKS ---- */
  .footer-links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 2rem;
    padding: 3rem 2rem 5rem;
  }

  .footer-links a {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gray);
    text-decoration: none;
    transition: color 0.2s;
  }

  .footer-links a:hover { color: var(--red); }

  /* ---- ANIMATIONS ---- */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  @media (max-width: 600px) {
    .section { padding: 2rem 1rem; }
    .role { padding: 1.25rem; min-height: 220px; }
    .role-title { font-size: 1.3rem; }
  }
</style>

<body>


<header class="page-header">
  <a href="/" class="back-link">&larr; stoptherace.ai</a>
  <h1>Work With <span class="red">Us</span></h1>
</header>

<!-- ROLES -->
<section class="section reveal">
  <div class="roles">
    <a class="role" href="/jobs/organizing-operations-lead" style="--i: 0;">
      <span class="role-bg" style="background-image: url('/media-kit-july/rachel_bujalski_2_web.jpg'); --pos: 66%; --vpos: 35%; view-transition-name: pic-organizing-operations-lead;"></span>
      <div class="role-text">
        <div class="role-title" style="view-transition-name: title-organizing-operations-lead;">Organizing &amp; Operations Lead</div>
        <div class="role-meta">$100k/year · San Francisco · Full-time, in person</div>
      </div>
      <span class="role-arrow">&rarr;</span>
    </a>
    <a class="role" href="/jobs/media-lead" style="--i: 1;">
      <span class="role-bg" style="background-image: url('/media-kit-july/camille_elize_cohen_1_web.jpg'); --pos: 30%; --vpos: 35%; view-transition-name: pic-media-lead;"></span>
      <div class="role-text">
        <div class="role-title" style="view-transition-name: title-media-lead;">Media Lead</div>
        <div class="role-meta">$100k/year · San Francisco or remote · Full-time</div>
      </div>
      <span class="role-arrow">&rarr;</span>
    </a>
    <a class="role" href="/jobs/chief-of-staff" style="--i: 2;">
      <span class="role-bg" style="background-image: url('/media-kit-july/rachel_bujalski_4_web.jpg'); --pos: 48%; --vpos: 6%; view-transition-name: pic-chief-of-staff;"></span>
      <div class="role-text">
        <div class="role-title" style="view-transition-name: title-chief-of-staff;">Chief of Staff</div>
        <div class="role-meta">$100k/year · San Francisco or remote · Full-time</div>
      </div>
      <span class="role-arrow">&rarr;</span>
    </a>
  </div>
</section>

<nav class="footer-links">
  <a href="/">&larr; stoptherace.ai</a>
  <a href="/join">Join the movement &rarr;</a>
</nav>

<script>
  // Scroll reveal
  const reveals = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.15 });
  reveals.forEach(el => observer.observe(el));

  // Old links like /jobs#media-lead now go to the role's own page
  const legacy = {
    'organizing-operational-lead': 'organizing-operations-lead',
    'organizing-operations-lead': 'organizing-operations-lead',
    'media-lead': 'media-lead',
    'chief-of-staff': 'chief-of-staff'
  };
  const target = legacy[location.hash.slice(1)];
  if (target) location.replace('/jobs/' + target);
</script>

</body>
